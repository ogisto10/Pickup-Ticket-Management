<div class="inline-flex align-items-center gap-1 border-1 surface-border border-round p-1 surface-card" role="group" aria-label="Language selector">
  <button
    *ngFor="let item of languages"
    type="button"
    (click)="selectLanguage(item.code)"
    [class]="currentLang() === item.code ? 'p-button p-component p-button-sm px-2 py-1 text-xs font-bold border-round' : 'p-button p-component p-button-sm p-button-text px-2 py-1 text-xs font-semibold text-600 border-round'"
  >
    {{ item.label }}
  </button>
</div>
